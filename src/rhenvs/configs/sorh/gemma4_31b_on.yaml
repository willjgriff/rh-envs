# google/gemma-4-31B-it, thinking on (sweep/mission_gemma_envs.md): qwen3.8_low.yaml with only the thinking kwargs (enable_thinking true; vLLM thinking_token_budget 4096)
# and the per-call max_tokens (8192) changed. Generated by ortho gemma_envs/make_configs.py.
# Qwen/Qwen3.8-27B at reasoning effort low, the sampling of grader/qwen3.8_low.yaml (temperature 1, top_p 0.95, top_k 20), with Meek et al.'s cap of 16384 new tokens:
# at 4096 the served model's answer was cut off, mostly still reasoning, on 43 of the 309 hack prompts and 6 of the 309 none prompts.
# The judge is Meek et al.'s GLM-5 through OpenRouter at its default reasoning, pinned to z-ai/fp8 (their grades came from Amazon Bedrock, OpenRouter's amazon-bedrock
# endpoint: the same labels on 10 of 10 answers at about twice the tokens).
judge:
    model: z-ai/glm-5
    provider: z-ai/fp8
    max_tokens: 4096           # Meek et al.'s judge cap
    max_connections: 32

model:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    extra_body:
        top_k: 20
        return_token_ids: true
        thinking_token_budget: 4096
        chat_template_kwargs:
            enable_thinking: true
