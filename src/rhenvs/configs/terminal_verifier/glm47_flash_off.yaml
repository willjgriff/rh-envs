# sweep/mission_second_model.md: qwen3.8_sweep.yaml for zai-org/GLM-4.7-Flash with thinking off. Only the thinking kwargs
# change: enable_thinking false (the template then ends the prompt with </think> and the answer starts). max_tokens as the Qwen config (8192).
offset_range: [4, 9]       # |GROUND_TRUTH - true answer| in the corrupted modes, drawn from this range with a random sign
command_timeout: 30        # seconds per command
max_output_chars: 4000     # a command's output is cut here before the model sees it

model:
    temperature: 1.0
    top_p: 1.0
    max_tokens: 8192
    extra_body:
        top_k: -1
        return_token_ids: true
        chat_template_kwargs:
            enable_thinking: false
