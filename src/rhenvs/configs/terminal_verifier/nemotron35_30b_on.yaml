# sweep/mission_second_model.md: qwen3.8_sweep.yaml for nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16 with thinking on. Only the thinking kwargs
# change: enable_thinking true (the template's default; no effort levels on this model) and truncate_history_thinking false, so every earlier turn's
# <think> block stays in the prompt as the Qwen sweep's renderer kept it (the template's default drops them). Sampling and env settings unchanged
# (temperature 1, top_p 1, no top_k, 8192 tokens per call; the README recommends top_p 0.95, not used). The 4096 thinking budget is set per request by
# the runner when the server supports it (see the box LOG), not here.
offset_range: [4, 9]       # |GROUND_TRUTH - true answer| in the corrupted modes, drawn from this range with a random sign
command_timeout: 30        # seconds per command
max_output_chars: 4000     # a command's output is cut here before the model sees it

model:
    temperature: 1.0
    top_p: 1.0
    max_tokens: 8192
    extra_body:
        top_k: -1
        return_token_ids: true
        chat_template_kwargs:
            enable_thinking: true
            truncate_history_thinking: false
