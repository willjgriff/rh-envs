# sweep/mission_second_model.md: qwen3.8_low.yaml for zai-org/GLM-4.7-Flash with thinking on (enable_thinking true, the
# template's default; this model has no effort levels). Sampling as the Qwen config (temperature 1, top_p 0.95, top_k 20); max_tokens 8192 per call
# The 4096 thinking budget is vLLM's thinking_token_budget sampling field, sent in extra_body (the box checked it forces </think> at the budget).
model:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    extra_body:
        top_k: 20
        return_token_ids: true
        thinking_token_budget: 4096   # vLLM forces </think> when the reasoning reaches it (checked on the box, LOG 11:12)
        chat_template_kwargs:
            enable_thinking: true
