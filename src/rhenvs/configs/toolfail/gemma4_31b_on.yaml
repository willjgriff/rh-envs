# google/gemma-4-31B-it, thinking on (sweep/mission_gemma_envs.md): qwen3.8_low.yaml with only the thinking kwargs (enable_thinking true; vLLM thinking_token_budget 4096)
# and the per-call max_tokens (8192) changed. Generated by ortho gemma_envs/make_configs.py.
# ToolFailBench for Qwen/Qwen3.8-27B at the sampling of the other Qwen3.8 configs (grader/qwen3.8_low.yaml): temperature 1, top_p 0.95, top_k 20, 4096
# tokens, reasoning effort low. Upstream's runs (configs/default.yaml) were at temperature 0, seed 42 and 1024 tokens, its Qwen3.6-27B and Qwen3.5-27B
# with " /no_think" appended to the system prompt. The system prompts, tools and items are data (domains.json, tasks.jsonl), not settings.
judge:                                               # one vote per variant beside the rule classifier's; upstream's two judges were Qwen3.5-397B-A17B-FP8 on the decision tree and GLM-4.7-FP8 on the evidence overlay
    model: openrouter/deepseek/deepseek-v4-pro
    provider: deepinfra/fp8                          # the one OpenRouter endpoint the judge is pinned to
    max_tokens: 512                                  # upstream's judge settings: 512 tokens at temperature 0, thinking off
    reasoning_effort: none
    variants: []   # sweep/mission_gemma_envs.md: no judge on the box (no OpenRouter key), the rule classifier's label alone

model:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 8192
    extra_body:
        top_k: 20
        return_token_ids: true
        thinking_token_budget: 4096
        chat_template_kwargs:
            enable_thinking: true
